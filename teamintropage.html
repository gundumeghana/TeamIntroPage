<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Introduction Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
            margin: 0;
            padding: 40px;
            text-align: center;
        }

        h1 {
            color: #222;
        }

        .team {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .member {
            background-color: white;
            width: 220px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .member img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
        }

        .member h2 {
            margin: 15px 0 8px;
        }

        .member p {
            color: #555;
        }
    </style>
</head>

<body>

    <h1>Welcome to Our Team</h1>

    <p>Meet the members of our product-based startup</p>

    <div class="team">

        <div class="member">
            <img src="https://via.placeholder.com/120" alt="Meghana">
            <h2>Meghana</h2>
            <p>Department: Computer Science</p>
        </div>

        <div class="member">
            <img src="https://via.placeholder.com/120" alt="Rahul">
            <h2>Rahul</h2>
            <p>Department: Software Development</p>
        </div>

        <div class="member">
            <img src="https://via.placeholder.com/120" alt="Priya">
            <h2>Priya</h2>
            <p>Department: UI/UX Design</p>
        </div>

    </div>

</body>
</html>
